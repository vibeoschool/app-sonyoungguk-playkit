<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seats — 자리배치 도우미</title>
<style>
  :root {
    --bg: #07080d;
    --panel: rgba(255,255,255,.05);
    --panel2: rgba(255,255,255,.018);
    --field: #0b0d13;
    --text: #f2f4fa;
    --muted: #8f97a8;
    --line: rgba(255,255,255,.08);
    --teal: #5eead4;
    --indigo: #8b9dff;
    --rose: #ff7a6b;
    --amber: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(900px 620px at 12% -12%, rgba(94,234,212,.07), transparent 60%),
      radial-gradient(1000px 700px at 88% -18%, rgba(139,157,255,.08), transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh; padding: 24px 16px 48px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header.top { text-align: center; margin-bottom: 28px; }
  header.top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  header.top p { color: var(--muted); font-size: 13px; margin-top: 8px; max-width: 62ch; margin-left: auto; margin-right: auto; line-height: 1.6; }

  button {
    font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text);
    padding: 9px 14px; transition: .15s;
  }
  button:hover { background: rgba(255,255,255,.05); }
  button:active { transform: scale(.98); }
  button.primary { background: var(--teal); color: #07080d; border-color: var(--teal); font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger, button.danger-text { color: var(--rose); border-color: rgba(255,122,107,.3); }
  button.danger:hover, button.danger-text:hover { background: rgba(255,122,107,.1); }
  button.danger-text { border: none; background: none; padding: 4px 8px; font-size: 12px; }

  input[type="text"], input[type="number"], select {
    font-family: inherit; font-size: 13.5px;
    background: var(--field); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; width: 100%; outline: none;
  }
  input:focus, select:focus { border-color: var(--teal); }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); border-radius: 20px; padding: 18px;
    box-shadow: 0 18px 44px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .panel h2 small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 4px; }

  .roster-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
  .roster-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px;
  }
  .roster-item .name { flex: 1; }
  .roster-item .tag {
    font-size: 10.5px; font-weight: 700; color: var(--teal); background: rgba(94,234,212,.12);
    padding: 3px 8px; border-radius: 999px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  .roster-item .tag.off { color: var(--muted); background: transparent; border: 1px solid var(--line); }

  .pair-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .pair-item {
    background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
  }
  .pair-item .txt { line-height: 1.4; }
  .pair-item .txt .reason { color: var(--muted); font-size: 11.5px; display: block; margin-top: 1px; }

  .empty-hint { font-size: 12px; color: var(--muted); padding: 6px 2px; line-height: 1.5; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

  .tabs { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 5px; border-radius: 14px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .tabs button.on { background: var(--panel2); color: var(--teal); border-color: rgba(94,234,212,.25); }
  .tabs button.on.back { color: var(--indigo); border-color: rgba(139,157,255,.3); }

  .board-bar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px 10px 4px 4px;
    text-align: center; padding: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px;
    letter-spacing: .04em;
  }
  .board-bar.bottom { border-radius: 4px 4px 10px 10px; margin-bottom: 0; margin-top: 4px; }
  .chart-panel {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); border-radius: 20px; padding: 20px;
    box-shadow: 0 18px 44px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .seat-grid { display: grid; gap: 10px; justify-content: center; margin: 14px auto; overflow-x: auto; padding: 4px; }
  .seat {
    width: 92px; height: 68px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 600; text-align: center; padding: 4px; position: relative; cursor: grab;
    transition: border-color .15s, transform .1s, background .15s; word-break: keep-all;
  }
  .seat.empty { color: #4a515f; font-size: 11px; font-weight: 500; border-style: dashed; cursor: default; }
  .seat.conflict { border-color: var(--rose); background: rgba(255,122,107,.12); }
  .seat.frontneed::before {
    content: ''; position: absolute; top: 6px; left: 6px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px rgba(94,234,212,.6);
  }
  .seat.dragover { transform: scale(1.05); border-color: var(--indigo); background: rgba(139,157,255,.12); }
  .seat .sname { color: var(--text); }
  .seat .warn-icon { font-size: 10.5px; color: var(--rose); margin-top: 2px; font-weight: 700; }

  .summary-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .stat { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; min-width: 120px; }
  .stat .num { font-size: 22px; font-weight: 800; }
  .stat.ok .num { color: var(--teal); }
  .stat.bad .num { color: var(--rose); }
  .stat .lbl { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .conflict-list { margin-top: 14px; }
  .conflict-list .ci {
    background: rgba(255,122,107,.1); border: 1px solid rgba(255,122,107,.25); color: #ffb3a8;
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 6px;
  }

  .empty-main { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .home-btn {
    position: fixed; top: 16px; left: 16px; z-index: 60;
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: #eef0f6; text-decoration: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: .15s;
  }
  .home-btn:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }

  @media print {
    .home-btn, header.top, .layout > .side, .actions, .tabs, .legend, .conflict-list, .summary-row { display: none !important; }
    .layout { display: block; }
    body { background: #fff; color: #000; padding: 0; }
    .chart-panel { border: none; box-shadow: none; }
  }
</style>
</head>
<body>
  <a href="index.html" class="home-btn" aria-label="홈으로" title="홈으로">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </a>

<div class="wrap">
  <header class="top">
    <h1>🪑 Seats — 자리배치 도우미</h1>
    <p>학생 명단과 갈등 관계를 등록하면 다투는 학생끼리는 떨어뜨리고, 배려가 필요한 학생은 앞자리로 배치해요. 배치 결과는 자리를 직접 끌어다 바꿀 수도 있어요.</p>
  </header>

  <div class="layout">
    <div class="side">
      <div class="panel">
        <h2>학급 좌석 설정<small>줄과 열 수를 정해요</small></h2>
        <div class="config-grid">
          <div><label for="cfgRows">줄 수</label><input type="number" id="cfgRows" min="1" max="10" value="5"></div>
          <div><label for="cfgCols">열 수</label><input type="number" id="cfgCols" min="1" max="10" value="6"></div>
          <div><label for="cfgFront">앞자리 기준 줄</label><input type="number" id="cfgFront" min="1" max="5" value="2"></div>
        </div>
        <div class="empty-hint">앞자리 기준 줄 수는 칠판에서부터 몇 번째 줄까지를 "앞자리"로 볼지 정해요.</div>
      </div>

      <div class="panel">
        <h2>학생 명단<small>이름을 입력하고 추가해요</small></h2>
        <div class="row">
          <input type="text" id="studentName" placeholder="예: 김민준" maxlength="12">
          <button class="primary" id="addStudentBtn" style="flex:0 0 auto;">추가</button>
        </div>
        <button id="loadDemoBtn" style="width:100%; margin-bottom:10px;">🎲 예시 학생 30명 랜덤으로 채우기</button>
        <div id="studentError" style="color:var(--rose); font-size:12px; display:none; margin-bottom:6px;"></div>
        <div id="rosterList" class="roster-list"></div>
        <div class="empty-hint">이름 옆 태그를 누르면 앞자리가 필요한 학생으로 표시할 수 있어요.</div>
      </div>

      <div class="panel">
        <h2>갈등 관계<small>옆이나 앞뒤로 앉히면 안 되는 사이</small></h2>
        <div class="row">
          <select id="conflictA"></select>
          <select id="conflictB"></select>
        </div>
        <div class="row">
          <input type="text" id="conflictReason" placeholder="이유 (선택, 예: 자주 다툼)" maxlength="30">
          <button id="addConflictBtn" style="flex:0 0 auto;">등록</button>
        </div>
        <div id="conflictError" style="color:var(--rose); font-size:12px; display:none;"></div>
        <div id="conflictList" class="pair-list"></div>
      </div>

      <div class="panel">
        <h2>같이 앉히고 싶은 사이<small>선택 사항, 가능하면 붙여줘요</small></h2>
        <div class="row">
          <select id="prefA"></select>
          <select id="prefB"></select>
        </div>
        <div class="row">
          <input type="text" id="prefReason" placeholder="이유 (선택)" maxlength="30">
          <button id="addPrefBtn" style="flex:0 0 auto;">등록</button>
        </div>
        <div id="prefError" style="color:var(--rose); font-size:12px; display:none;"></div>
        <div id="prefList" class="pair-list"></div>
      </div>
    </div>

    <div class="main">
      <div class="actions">
        <button class="primary" id="runBtn">자리 배치 실행</button>
        <button id="reshuffleBtn">다시 섞기</button>
        <button id="printBtn">인쇄용으로 보기</button>
        <button class="danger" id="resetBtn">전체 초기화</button>
      </div>

      <div class="tabs">
        <button id="tabFront" class="on" type="button">👁 교실 앞쪽 기준 (칠판 위)</button>
        <button id="tabBack" type="button">↩ 교실 뒤쪽 기준 (칠판 아래, 180°)</button>
      </div>

      <div id="mainArea"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var STORAGE_KEY = 'seating-planner-v1';
  var viewPerspective = 'front';
  var state = {
    students: [],
    conflicts: [],
    preferences: [],
    config: { rows: 5, cols: 6, front: 2 },
    arrangement: null
  };

  function uid() { return 'st_' + Math.random().toString(36).slice(2, 9); }

  var NAME_POOL = [
    "김강우","이서준","박민지","최현우","정예은","한상우","윤지민","송준우","임도윤",
    "신채원","오지후","서아린","황예준","홍다은","고준영","전소율","권지혁","양서우",
    "배은우","백지아","유민재","조하은","남우진","심서현","노유준","문서준","장하린",
    "백승우","구민서","나연우","선유진","표지안","공하은","마도윤","방서연","제민준",
    "위지호","염서은","탁하준","성은우"
  ];

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          state.students = Array.isArray(parsed.students) ? parsed.students : [];
          state.conflicts = Array.isArray(parsed.conflicts) ? parsed.conflicts : [];
          state.preferences = Array.isArray(parsed.preferences) ? parsed.preferences : [];
          state.config = parsed.config || state.config;
          state.arrangement = parsed.arrangement || null;
        }
      }
    } catch (e) { /* 저장된 데이터가 없거나 읽을 수 없음 */ }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* 저장 실패 시 조용히 무시 */ }
  }

  function studentById(id) {
    for (var i = 0; i < state.students.length; i++) {
      if (state.students[i].id === id) return state.students[i];
    }
    return null;
  }

  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  // ---------- 렌더: 학생 명단 ----------
  function renderRoster() {
    var list = document.getElementById('rosterList');
    list.innerHTML = '';
    if (state.students.length === 0) {
      list.innerHTML = '<div class="empty-hint">등록된 학생이 없어요.</div>';
    }
    state.students.forEach(function(s) {
      var item = document.createElement('div');
      item.className = 'roster-item';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = s.name;
      var tag = document.createElement('span');
      tag.className = 'tag' + (s.frontNeeded ? '' : ' off');
      tag.textContent = s.frontNeeded ? '앞자리 필요' : '앞자리 필요 아님';
      tag.title = '눌러서 전환';
      tag.addEventListener('click', function() {
        s.frontNeeded = !s.frontNeeded;
        saveState();
        renderRoster();
      });
      var del = document.createElement('button');
      del.className = 'danger-text';
      del.textContent = '삭제';
      del.addEventListener('click', function() {
        state.students = state.students.filter(function(x) { return x.id !== s.id; });
        state.conflicts = state.conflicts.filter(function(c) { return c.a !== s.id && c.b !== s.id; });
        state.preferences = state.preferences.filter(function(c) { return c.a !== s.id && c.b !== s.id; });
        saveState();
        renderAll();
      });
      item.appendChild(nameSpan);
      item.appendChild(tag);
      item.appendChild(del);
      list.appendChild(item);
    });
    renderSelects();
  }

  function renderSelects() {
    ['conflictA', 'conflictB', 'prefA', 'prefB'].forEach(function(id) {
      var sel = document.getElementById(id);
      var current = sel.value;
      sel.innerHTML = '';
      if (state.students.length < 2) {
        var opt = document.createElement('option');
        opt.textContent = '학생을 2명 이상 등록해 주세요';
        opt.value = '';
        sel.appendChild(opt);
        sel.disabled = true;
        return;
      }
      sel.disabled = false;
      state.students.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        sel.appendChild(opt);
      });
      if (current) sel.value = current;
    });
  }

  // ---------- 렌더: 갈등/선호 목록 ----------
  function renderPairList(listId, pairs, emptyText) {
    var el = document.getElementById(listId);
    el.innerHTML = '';
    if (pairs.length === 0) {
      el.innerHTML = '<div class="empty-hint">' + emptyText + '</div>';
      return;
    }
    pairs.forEach(function(p) {
      var sa = studentById(p.a), sb = studentById(p.b);
      if (!sa || !sb) return;
      var item = document.createElement('div');
      item.className = 'pair-item';
      var txt = document.createElement('div');
      txt.className = 'txt';
      txt.innerHTML = sa.name + ' ↔ ' + sb.name +
        (p.reason ? '<span class="reason">' + escapeHtml(p.reason) + '</span>' : '');
      var del = document.createElement('button');
      del.className = 'danger-text';
      del.textContent = '삭제';
      del.addEventListener('click', function() {
        if (listId === 'conflictList') {
          state.conflicts = state.conflicts.filter(function(x) { return x.id !== p.id; });
        } else {
          state.preferences = state.preferences.filter(function(x) { return x.id !== p.id; });
        }
        saveState();
        renderAll();
      });
      item.appendChild(txt);
      item.appendChild(del);
      el.appendChild(item);
    });
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- 점수 계산 ----------
  function computeScore(arr, rows, cols, front) {
    var conflictSet = {}, prefSet = {};
    state.conflicts.forEach(function(c) { conflictSet[pairKey(c.a, c.b)] = true; });
    state.preferences.forEach(function(c) { prefSet[pairKey(c.a, c.b)] = true; });

    var conflictCount = 0, prefCount = 0, frontViolation = 0;
    var conflictSeats = {};

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var idx = r * cols + c;
        var sid = arr[idx];
        if (!sid) continue;
        var student = studentById(sid);
        if (student && student.frontNeeded && r >= front) frontViolation++;

        if (c + 1 < cols) {
          var rid = arr[idx + 1];
          if (rid) {
            var k = pairKey(sid, rid);
            if (conflictSet[k]) { conflictCount++; conflictSeats[idx] = true; conflictSeats[idx + 1] = true; }
            if (prefSet[k]) prefCount++;
          }
        }
        if (r + 1 < rows) {
          var did = arr[idx + cols];
          if (did) {
            var k2 = pairKey(sid, did);
            if (conflictSet[k2]) { conflictCount++; conflictSeats[idx] = true; conflictSeats[idx + cols] = true; }
            if (prefSet[k2]) prefCount++;
          }
        }
      }
    }
    var score = conflictCount * 1000 + frontViolation * 80 - prefCount * 15;
    return { score: score, conflictCount: conflictCount, prefCount: prefCount, frontViolation: frontViolation, conflictSeats: conflictSeats };
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  function optimizeArrangement(rows, cols, front) {
    var seats = rows * cols;
    var studentIds = state.students.map(function(s) { return s.id; });
    var best = null, bestScore = Infinity;
    var restarts = studentIds.length > 24 ? 4 : 7;

    for (var restart = 0; restart < restarts; restart++) {
      var positions = [];
      for (var i = 0; i < seats; i++) positions.push(i);
      shuffle(positions);
      var current = new Array(seats).fill(null);
      studentIds.forEach(function(id, i) { current[positions[i]] = id; });
      var currentScore = computeScore(current, rows, cols, front).score;

      var T = 5.0;
      var steps = studentIds.length > 24 ? 900 : 1400;
      for (var step = 0; step < steps; step++) {
        T *= 0.995;
        var a = Math.floor(Math.random() * seats);
        var b = Math.floor(Math.random() * seats);
        if (a === b) continue;
        var tmp = current[a]; current[a] = current[b]; current[b] = tmp;
        var newScore = computeScore(current, rows, cols, front).score;
        var delta = newScore - currentScore;
        if (delta <= 0 || Math.random() < Math.exp(-delta / Math.max(T, 0.001))) {
          currentScore = newScore;
          if (currentScore < bestScore) { bestScore = currentScore; best = current.slice(); }
        } else {
          var tmp2 = current[a]; current[a] = current[b]; current[b] = tmp2;
        }
      }
    }
    return best;
  }

  // ---------- 렌더: 메인 좌석 배치도 ----------
  function renderMain() {
    var main = document.getElementById('mainArea');
    var rows = state.config.rows, cols = state.config.cols;
    var seatCount = rows * cols;

    if (state.students.length === 0) {
      main.innerHTML = '<div class="chart-panel"><div class="empty-main">왼쪽에서 학생을 먼저 등록해 주세요.<br>등록 후 "자리 배치 실행"을 누르면 자리를 정해드려요.</div></div>';
      return;
    }

    if (state.students.length > seatCount) {
      main.innerHTML = '<div class="chart-panel"><div class="empty-main">좌석(' + seatCount + '석)이 학생 수(' + state.students.length + '명)보다 적어요.<br>줄이나 열 수를 늘려 주세요.</div></div>';
      return;
    }

    if (!state.arrangement) {
      main.innerHTML = '<div class="chart-panel"><div class="empty-main">"자리 배치 실행"을 누르면 갈등을 피해 자리를 정해드려요.</div></div>';
      return;
    }

    var scoreInfo = computeScore(state.arrangement, rows, cols, state.config.front);
    var isBack = viewPerspective === 'back';

    var boardBarHtml = '<div class="board-bar' + (isBack ? ' bottom' : '') + '">칠판 쪽</div>';
    var seatGridHtml = '<div class="seat-grid" id="seatGrid" style="grid-template-columns: repeat(' + cols + ', 92px);"></div>';

    var html = '<div class="chart-panel">';
    html += isBack ? (seatGridHtml + boardBarHtml) : (boardBarHtml + seatGridHtml);
    html += '<div class="legend">';
    html += '<span><span class="dot" style="background:var(--teal)"></span>앞자리가 필요한 학생</span>';
    html += '<span><span class="dot" style="background:var(--rose)"></span>갈등 관계가 붙어 있는 자리</span>';
    html += '</div>';

    html += '<div class="summary-row">';
    html += '<div class="stat ' + (scoreInfo.conflictCount === 0 ? 'ok' : 'bad') + '"><div class="num">' + scoreInfo.conflictCount + '</div><div class="lbl">남은 갈등 쌍</div></div>';
    html += '<div class="stat ' + (scoreInfo.frontViolation === 0 ? 'ok' : 'bad') + '"><div class="num">' + scoreInfo.frontViolation + '</div><div class="lbl">앞자리 배려 못 지킨 학생</div></div>';
    html += '<div class="stat"><div class="num">' + scoreInfo.prefCount + '</div><div class="lbl">함께 앉은 선호 쌍</div></div>';
    html += '</div>';

    if (scoreInfo.conflictCount > 0) {
      html += '<div class="conflict-list" id="conflictDetailList"></div>';
    }
    html += '</div>';

    main.innerHTML = html;

    var grid = document.getElementById('seatGrid');
    var rOrder = [], cOrder = [];
    for (var ri = 0; ri < rows; ri++) rOrder.push(isBack ? rows - 1 - ri : ri);
    for (var ci = 0; ci < cols; ci++) cOrder.push(isBack ? cols - 1 - ci : ci);
    rOrder.forEach(function(r) {
      cOrder.forEach(function(c) {
        var idx = r * cols + c;
        var sid = state.arrangement[idx];
        var seatEl = document.createElement('div');
        seatEl.dataset.idx = idx;
        if (!sid) {
          seatEl.className = 'seat empty';
          seatEl.textContent = '빈자리';
        } else {
          var student = studentById(sid);
          seatEl.className = 'seat' + (scoreInfo.conflictSeats[idx] ? ' conflict' : '') + (student && student.frontNeeded ? ' frontneed' : '');
          seatEl.draggable = true;
          var nameEl = document.createElement('div');
          nameEl.className = 'sname';
          nameEl.textContent = student ? student.name : '';
          seatEl.appendChild(nameEl);
          if (scoreInfo.conflictSeats[idx]) {
            var warnEl = document.createElement('div');
            warnEl.className = 'warn-icon';
            warnEl.textContent = '갈등 주의';
            seatEl.appendChild(warnEl);
          }
        }
        attachDragEvents(seatEl);
        grid.appendChild(seatEl);
      });
    });

    if (scoreInfo.conflictCount > 0) {
      var detailList = document.getElementById('conflictDetailList');
      state.conflicts.forEach(function(c) {
        var ia = state.arrangement.indexOf(c.a);
        var ib = state.arrangement.indexOf(c.b);
        if (ia === -1 || ib === -1) return;
        var ra = Math.floor(ia / cols), ca = ia % cols;
        var rb = Math.floor(ib / cols), cb = ib % cols;
        var adjacent = (ra === rb && Math.abs(ca - cb) === 1) || (ca === cb && Math.abs(ra - rb) === 1);
        if (adjacent) {
          var sa = studentById(c.a), sb = studentById(c.b);
          var row = document.createElement('div');
          row.className = 'ci';
          row.textContent = sa.name + '와(과) ' + sb.name + '이(가) 붙어 있어요' + (c.reason ? ' (' + c.reason + ')' : '');
          detailList.appendChild(row);
        }
      });
    }
  }

  function attachDragEvents(seatEl) {
    seatEl.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', seatEl.dataset.idx);
    });
    seatEl.addEventListener('dragover', function(e) {
      e.preventDefault();
      seatEl.classList.add('dragover');
    });
    seatEl.addEventListener('dragleave', function() {
      seatEl.classList.remove('dragover');
    });
    seatEl.addEventListener('drop', function(e) {
      e.preventDefault();
      seatEl.classList.remove('dragover');
      var fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
      var toIdx = parseInt(seatEl.dataset.idx, 10);
      if (fromIdx === toIdx || isNaN(fromIdx)) return;
      var tmp = state.arrangement[fromIdx];
      state.arrangement[fromIdx] = state.arrangement[toIdx];
      state.arrangement[toIdx] = tmp;
      saveState();
      renderMain();
    });
  }

  function renderAll() {
    renderRoster();
    renderPairList('conflictList', state.conflicts, '등록된 갈등 관계가 없어요.');
    renderPairList('prefList', state.preferences, '등록된 선호 관계가 없어요.');
    renderMain();
    document.getElementById('cfgRows').value = state.config.rows;
    document.getElementById('cfgCols').value = state.config.cols;
    document.getElementById('cfgFront').value = state.config.front;
  }

  // ---------- 시점 전환 ----------
  function setPerspective(mode) {
    if (viewPerspective === mode) return;
    viewPerspective = mode;
    var tf = document.getElementById('tabFront'), tb = document.getElementById('tabBack');
    if (mode === 'front') {
      tf.classList.add('on'); tb.classList.remove('on', 'back');
    } else {
      tb.classList.add('on', 'back'); tf.classList.remove('on');
    }
    renderMain();
  }

  // ---------- 예시 명단 ----------
  function loadDemoStudents() {
    if (state.students.length > 0 && !confirm('현재 명단을 지우고 예시 학생 30명을 넣을까요?')) return;
    var pool = NAME_POOL.slice();
    shuffle(pool);
    state.students = pool.slice(0, 30).map(function(name) {
      return { id: uid(), name: name, frontNeeded: false };
    });
    state.conflicts = [];
    state.preferences = [];
    state.arrangement = null;
    saveState();
    renderAll();
  }

  // ---------- 이벤트 바인딩 ----------
  document.getElementById('addStudentBtn').addEventListener('click', function() {
    var input = document.getElementById('studentName');
    var name = input.value.trim();
    var errEl = document.getElementById('studentError');
    errEl.style.display = 'none';
    if (!name) { errEl.textContent = '학생 이름을 입력해 주세요.'; errEl.style.display = 'block'; return; }
    if (state.students.some(function(s) { return s.name === name; })) {
      errEl.textContent = '이미 등록된 이름이에요.';
      errEl.style.display = 'block';
      return;
    }
    state.students.push({ id: uid(), name: name, frontNeeded: false });
    input.value = '';
    saveState();
    renderAll();
  });
  document.getElementById('studentName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('addStudentBtn').click();
  });
  document.getElementById('loadDemoBtn').addEventListener('click', loadDemoStudents);
  document.getElementById('tabFront').addEventListener('click', function() { setPerspective('front'); });
  document.getElementById('tabBack').addEventListener('click', function() { setPerspective('back'); });

  document.getElementById('addConflictBtn').addEventListener('click', function() {
    var a = document.getElementById('conflictA').value;
    var b = document.getElementById('conflictB').value;
    var reason = document.getElementById('conflictReason').value.trim();
    var errEl = document.getElementById('conflictError');
    errEl.style.display = 'none';
    if (!a || !b) { errEl.textContent = '학생을 선택해 주세요.'; errEl.style.display = 'block'; return; }
    if (a === b) { errEl.textContent = '서로 다른 학생을 선택해 주세요.'; errEl.style.display = 'block'; return; }
    if (state.conflicts.some(function(c) { return pairKey(c.a, c.b) === pairKey(a, b); })) {
      errEl.textContent = '이미 등록된 갈등 관계예요.';
      errEl.style.display = 'block';
      return;
    }
    state.conflicts.push({ id: uid(), a: a, b: b, reason: reason });
    document.getElementById('conflictReason').value = '';
    saveState();
    renderAll();
  });

  document.getElementById('addPrefBtn').addEventListener('click', function() {
    var a = document.getElementById('prefA').value;
    var b = document.getElementById('prefB').value;
    var reason = document.getElementById('prefReason').value.trim();
    var errEl = document.getElementById('prefError');
    errEl.style.display = 'none';
    if (!a || !b) { errEl.textContent = '학생을 선택해 주세요.'; errEl.style.display = 'block'; return; }
    if (a === b) { errEl.textContent = '서로 다른 학생을 선택해 주세요.'; errEl.style.display = 'block'; return; }
    if (state.preferences.some(function(c) { return pairKey(c.a, c.b) === pairKey(a, b); })) {
      errEl.textContent = '이미 등록된 선호 관계예요.';
      errEl.style.display = 'block';
      return;
    }
    state.preferences.push({ id: uid(), a: a, b: b, reason: reason });
    document.getElementById('prefReason').value = '';
    saveState();
    renderAll();
  });

  ['cfgRows', 'cfgCols', 'cfgFront'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
      var rows = Math.max(1, Math.min(10, parseInt(document.getElementById('cfgRows').value, 10) || 1));
      var cols = Math.max(1, Math.min(10, parseInt(document.getElementById('cfgCols').value, 10) || 1));
      var front = Math.max(1, Math.min(rows, parseInt(document.getElementById('cfgFront').value, 10) || 1));
      state.config = { rows: rows, cols: cols, front: front };
      state.arrangement = null;
      saveState();
      renderAll();
    });
  });

  document.getElementById('runBtn').addEventListener('click', function() {
    if (state.students.length === 0) return;
    if (state.students.length > state.config.rows * state.config.cols) return;
    var btn = document.getElementById('runBtn');
    btn.textContent = '배치 중...';
    btn.disabled = true;
    setTimeout(function() {
      state.arrangement = optimizeArrangement(state.config.rows, state.config.cols, state.config.front);
      saveState();
      renderMain();
      btn.textContent = '자리 배치 실행';
      btn.disabled = false;
    }, 30);
  });

  document.getElementById('reshuffleBtn').addEventListener('click', function() {
    document.getElementById('runBtn').click();
  });

  document.getElementById('printBtn').addEventListener('click', function() {
    window.print();
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (!confirm('학생 명단, 갈등 관계, 배치 결과를 모두 지울까요?')) return;
    state = { students: [], conflicts: [], preferences: [], config: { rows: 5, cols: 6, front: 2 }, arrangement: null };
    saveState();
    renderAll();
  });

  loadState();
  renderAll();
})();
</script>
</body>
</html>
