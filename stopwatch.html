<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch — 스톱워치 & 타이머</title>
<style>
  :root {
    --bg: #07080d;
    --panel: rgba(255,255,255,.05);
    --panel2: rgba(255,255,255,.018);
    --field: #0b0d13;
    --text: #f2f4fa;
    --muted: #8f97a8;
    --line: rgba(255,255,255,.08);
    --teal: #5eead4;
    --indigo: #8b9dff;
    --rose: #ff7a6b;
    --amber: #ffd166;
    --sky: #7dd3fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(900px 620px at 12% -12%, rgba(125,211,252,.07), transparent 60%),
      radial-gradient(1000px 700px at 88% -18%, rgba(139,157,255,.08), transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh; padding: 24px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header.top { text-align: center; margin-bottom: 22px; }
  header.top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  header.top p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .tabs { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 5px; border-radius: 14px; max-width: 360px; margin: 0 auto 18px; }
  .tabs button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; transition: .15s; font-family: inherit;
  }
  .tabs button.on { background: var(--panel2); color: var(--sky); border-color: rgba(125,211,252,.3); }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); border-radius: 24px; padding: 28px 20px;
    box-shadow: 0 18px 44px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .stage[hidden] { display: none; }

  .display {
    font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -2px; line-height: 1;
    font-size: clamp(56px, 15vw, 150px); text-align: center; white-space: nowrap;
  }
  .display .ms { font-size: .42em; color: var(--muted); letter-spacing: -1px; margin-left: 4px; }
  .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 18px; }

  .ctrls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px 22px; min-width: 112px; border-radius: 14px;
    border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; transition: .15s;
  }
  .btn:hover:not(:disabled) { background: rgba(255,255,255,.06); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: linear-gradient(135deg, #7dd3fc, #5eead4); color: #04212a; border: none; box-shadow: 0 8px 24px rgba(94,234,212,.22); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: linear-gradient(135deg, #7dd3fc, #5eead4); }
  .btn.pause { background: linear-gradient(135deg, #ffd166, #f7b93e); color: #2b2405; border: none; }
  .btn.pause:hover:not(:disabled) { filter: brightness(1.06); background: linear-gradient(135deg, #ffd166, #f7b93e); }

  /* 구간 기록 */
  .laps { width: 100%; max-width: 520px; }
  .laps table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  .laps th { text-align: right; color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .laps th:first-child, .laps td:first-child { text-align: left; }
  .laps td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .laps tr.best td { color: var(--teal); }
  .laps tr.worst td { color: var(--rose); }
  .laps .tagx { font-size: 10.5px; font-weight: 700; margin-left: 6px; }
  .laps-wrap { max-height: 300px; overflow-y: auto; width: 100%; display: flex; justify-content: center; }

  /* 타이머 */
  .ring { position: relative; width: min(78vw, 380px); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.07); }
  .ring .bar { stroke: var(--sky); stroke-linecap: round; transition: stroke .3s; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .ring .display { font-size: clamp(48px, 15vw, 96px); }
  .timer-stage.warn .ring .bar { stroke: var(--amber); }
  .timer-stage.warn .ring .display { color: var(--amber); }
  .timer-stage.done .ring .bar { stroke: var(--rose); }
  .timer-stage.done .ring .display { color: var(--rose); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--sky); color: var(--sky); }
  .chip.on { border-color: var(--sky); color: var(--sky); background: rgba(125,211,252,.1); }
  .custom { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .custom input {
    width: 64px; padding: 9px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--field);
    color: var(--text); font-size: 16px; font-weight: 800; text-align: center; outline: none; font-family: inherit;
    -moz-appearance: textfield;
  }
  .custom input::-webkit-outer-spin-button, .custom input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .custom input:focus { border-color: var(--sky); }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .opt input { accent-color: var(--sky); width: 16px; height: 16px; }

  .foot { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.7; }
  kbd { font-family: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--field); color: var(--text); }

  /* 전체 화면: 숫자만 크게 */
  body.fs { padding: 16px; display: flex; flex-direction: column; justify-content: center; }
  body.fs header.top, body.fs .tabs, body.fs .hint, body.fs .home-btn, body.fs .laps-wrap, body.fs .presets, body.fs .custom, body.fs .opt { display: none !important; }
  body.fs .wrap { max-width: none; width: 100%; }
  body.fs .panel { border: none; background: none; box-shadow: none; }
  body.fs .stage > .display { font-size: min(22vw, 38vh); }
  body.fs .ring { width: min(72vh, 90vw); }
  body.fs .ring .display { font-size: min(14vw, 20vh); }

  .home-btn {
    position: fixed; top: 16px; left: 16px; z-index: 60;
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: #eef0f6; text-decoration: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: .15s;
  }
  .home-btn:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
</style>
</head>
<body>
  <a href="index.html" class="home-btn" aria-label="홈으로" title="홈으로">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </a>

  <div class="wrap">
    <header class="top">
      <h1>⏱️ Stopwatch — 스톱워치 & 타이머</h1>
      <p>수업 활동 시간 재기 · 전체 화면으로 TV·프로젝터에 크게 띄우기</p>
    </header>

    <div class="tabs" role="tablist">
      <button id="tab-sw" class="on" role="tab">⏱ 스톱워치</button>
      <button id="tab-tm" role="tab">⏳ 타이머</button>
    </div>

    <div class="panel">
      <!-- 스톱워치 -->
      <section class="stage" id="sw-stage">
        <div class="display" id="sw-display">00:00<span class="ms">.00</span></div>
        <div class="ctrls">
          <button class="btn primary" id="sw-start">시작</button>
          <button class="btn" id="sw-lap" disabled>구간 기록</button>
          <button class="btn" id="sw-reset" disabled>초기화</button>
        </div>
        <div class="laps-wrap">
          <div class="laps" id="laps" hidden>
            <table>
              <thead><tr><th>구간</th><th>구간 시간</th><th>누적 시간</th></tr></thead>
              <tbody id="lap-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 타이머 -->
      <section class="stage timer-stage" id="tm-stage" hidden>
        <div class="presets" id="presets">
          <button class="chip" data-sec="30">30초</button>
          <button class="chip" data-sec="60">1분</button>
          <button class="chip" data-sec="180">3분</button>
          <button class="chip on" data-sec="300">5분</button>
          <button class="chip" data-sec="600">10분</button>
          <button class="chip" data-sec="900">15분</button>
          <button class="chip" data-sec="1800">30분</button>
        </div>
        <div class="custom">
          직접 입력
          <input type="number" id="tm-min" min="0" max="180" value="5" aria-label="분">분
          <input type="number" id="tm-sec" min="0" max="59" value="0" aria-label="초">초
        </div>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>
            <circle class="bar" id="tm-bar" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>
          </svg>
          <div class="center">
            <div class="display" id="tm-display">05:00</div>
            <div class="sub" id="tm-sub">5분 타이머</div>
          </div>
        </div>
        <div class="ctrls">
          <button class="btn primary" id="tm-start">시작</button>
          <button class="btn" id="tm-reset">초기화</button>
        </div>
        <label class="opt"><input type="checkbox" id="tm-sound" checked> 끝나면 알림음 울리기</label>
      </section>

      <div class="foot">
        <button class="btn" id="btn-fs">⛶ 전체 화면</button>
      </div>
    </div>

    <p class="hint"><kbd>Space</kbd> 시작/일시정지 · <kbd>L</kbd> 구간 기록 · <kbd>R</kbd> 초기화 · <kbd>F</kbd> 전체 화면</p>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  // 시간 표시: 1시간 이상이면 h:mm:ss
  function fmtClock(totalSec) {
    const h = Math.floor(totalSec / 3600), m = Math.floor(totalSec % 3600 / 60), s = totalSec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function fmtPrecise(ms) {
    return fmtClock(Math.floor(ms / 1000)) + '.' + pad(Math.floor(ms % 1000 / 10));
  }

  // ---------- 탭 ----------
  let mode = 'sw';
  function setMode(m) {
    mode = m;
    $('tab-sw').classList.toggle('on', m === 'sw');
    $('tab-tm').classList.toggle('on', m === 'tm');
    $('sw-stage').hidden = m !== 'sw';
    $('tm-stage').hidden = m !== 'tm';
  }
  $('tab-sw').addEventListener('click', () => setMode('sw'));
  $('tab-tm').addEventListener('click', () => setMode('tm'));

  // ---------- 스톱워치 ----------
  // 실행 중에는 시작 시각 기준으로 계산해 탭이 백그라운드여도 오차가 쌓이지 않는다
  let swRunning = false, swStart = 0, swElapsed = 0, laps = [], swRaf = null;
  const swNow = () => swRunning ? swElapsed + (performance.now() - swStart) : swElapsed;

  function swRender() {
    const ms = swNow();
    $('sw-display').innerHTML = fmtClock(Math.floor(ms / 1000)) + `<span class="ms">.${pad(Math.floor(ms % 1000 / 10))}</span>`;
    if (swRunning) swRaf = requestAnimationFrame(swRender);
  }
  function swToggle() {
    if (swRunning) {
      swElapsed = swNow(); swRunning = false; cancelAnimationFrame(swRaf);
    } else {
      swStart = performance.now(); swRunning = true; swRender();
    }
    swUpdateButtons();
  }
  function swLap() {
    if (!swRunning) return;
    const total = swNow();
    const prev = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total, split: total - prev });
    renderLaps();
  }
  function swReset() {
    if (swRunning) return;
    swElapsed = 0; laps = [];
    swRender(); renderLaps(); swUpdateButtons();
  }
  function swUpdateButtons() {
    const b = $('sw-start');
    b.textContent = swRunning ? '일시정지' : swElapsed ? '계속' : '시작';
    b.className = 'btn ' + (swRunning ? 'pause' : 'primary');
    $('sw-lap').disabled = !swRunning;
    $('sw-reset').disabled = swRunning || swElapsed === 0;
  }
  function renderLaps() {
    $('laps').hidden = laps.length === 0;
    let best = -1, worst = -1;
    if (laps.length >= 3) {
      laps.forEach((l, i) => {
        if (best < 0 || l.split < laps[best].split) best = i;
        if (worst < 0 || l.split > laps[worst].split) worst = i;
      });
    }
    $('lap-body').innerHTML = laps.map((l, i) => {
      const cls = i === best ? 'best' : i === worst ? 'worst' : '';
      const tag = i === best ? '<span class="tagx">가장 빠름</span>' : i === worst ? '<span class="tagx">가장 느림</span>' : '';
      return `<tr class="${cls}"><td>${i + 1}${tag}</td><td>${fmtPrecise(l.split)}</td><td>${fmtPrecise(l.total)}</td></tr>`;
    }).reverse().join('');
  }
  $('sw-start').addEventListener('click', swToggle);
  $('sw-lap').addEventListener('click', swLap);
  $('sw-reset').addEventListener('click', swReset);

  // ---------- 타이머 ----------
  const CIRC = 2 * Math.PI * 54;
  $('tm-bar').style.strokeDasharray = CIRC;
  let tmTotal = 300, tmRemainMs = 300000, tmRunning = false, tmEnd = 0, tmTick = null, tmDone = false;

  function tmRemain() { return tmRunning ? Math.max(0, tmEnd - performance.now()) : tmRemainMs; }
  function tmRender() {
    const ms = tmRemain();
    const sec = Math.ceil(ms / 1000);
    $('tm-display').textContent = fmtClock(sec);
    const frac = tmTotal ? ms / (tmTotal * 1000) : 0;
    $('tm-bar').style.strokeDashoffset = CIRC * (1 - frac);
    const stage = $('tm-stage');
    stage.classList.toggle('warn', !tmDone && sec <= 10 && ms < tmTotal * 1000);
    stage.classList.toggle('done', tmDone);
  }
  function tmLabel() {
    const m = Math.floor(tmTotal / 60), s = tmTotal % 60;
    return (m ? `${m}분` : '') + (s ? ` ${s}초` : '') + ' 타이머';
  }
  function tmSet(sec, syncInputs = true) {
    if (tmRunning) return;
    tmTotal = Math.max(1, Math.min(sec, 180 * 60 + 59));
    tmRemainMs = tmTotal * 1000; tmDone = false;
    if (syncInputs) { $('tm-min').value = Math.floor(tmTotal / 60); $('tm-sec').value = tmTotal % 60; }
    document.querySelectorAll('#presets .chip').forEach(c => c.classList.toggle('on', +c.dataset.sec === tmTotal));
    $('tm-sub').textContent = tmLabel().trim();
    tmRender(); tmUpdateButtons();
  }
  function tmToggle() {
    if (tmDone) { tmReset(); return; }
    if (tmRunning) {
      tmRemainMs = tmRemain(); tmRunning = false; clearInterval(tmTick);
    } else {
      if (inputSeconds() === 0) tmSet(tmTotal); // 0분 0초로 비워 둔 채 시작하면 칸을 원래 값으로 되돌린다
      unlockAudio();
      tmEnd = performance.now() + tmRemainMs; tmRunning = true;
      // setInterval은 백그라운드 탭에서도 돌아가므로 끝나는 시점을 놓치지 않는다
      tmTick = setInterval(() => {
        tmRender();
        if (tmRemain() <= 0) tmFinish();
      }, 100);
    }
    tmRender(); tmUpdateButtons();
  }
  function tmFinish() {
    clearInterval(tmTick); tmRunning = false; tmRemainMs = 0; tmDone = true;
    $('tm-sub').textContent = '시간 종료!';
    tmRender(); tmUpdateButtons();
    if ($('tm-sound').checked) playAlarm();
  }
  function tmReset() {
    clearInterval(tmTick); tmRunning = false; stopAlarm();
    tmSet(tmTotal);
  }
  function tmUpdateButtons() {
    const b = $('tm-start');
    b.textContent = tmDone ? '다시' : tmRunning ? '일시정지' : tmRemainMs < tmTotal * 1000 ? '계속' : '시작';
    b.className = 'btn ' + (tmRunning ? 'pause' : 'primary');
    document.querySelectorAll('#presets .chip, #tm-min, #tm-sec').forEach(el => el.disabled = tmRunning);
  }
  document.querySelectorAll('#presets .chip').forEach(c => c.addEventListener('click', () => tmSet(+c.dataset.sec)));
  // 입력하는 동안에는 칸 값을 건드리지 않고, 입력을 마치면(change) 정리된 값으로 맞춘다
  const inputSeconds = () => Math.max(0, parseInt($('tm-min').value) || 0) * 60 + Math.max(0, Math.min(59, parseInt($('tm-sec').value) || 0));
  ['tm-min', 'tm-sec'].forEach(id => {
    $(id).addEventListener('input', () => { if (inputSeconds() > 0) tmSet(inputSeconds(), false); });
    $(id).addEventListener('change', () => { if (inputSeconds() > 0) tmSet(inputSeconds()); });
  });
  $('tm-start').addEventListener('click', tmToggle);
  $('tm-reset').addEventListener('click', tmReset);

  // ---------- 알림음 (Web Audio, 외부 파일 없음) ----------
  let actx = null, alarmTimer = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(at, freq) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(.35, at + .02);
    g.gain.exponentialRampToValueAtTime(.001, at + .35);
    o.connect(g).connect(actx.destination);
    o.start(at); o.stop(at + .4);
  }
  function playAlarm() {
    if (!actx) return;
    let rounds = 0;
    const ring = () => {
      const t = actx.currentTime;
      beep(t, 880); beep(t + .45, 880); beep(t + .9, 1175);
      if (++rounds >= 4) stopAlarm();
    };
    ring();
    alarmTimer = setInterval(ring, 1800);
  }
  function stopAlarm() { clearInterval(alarmTimer); alarmTimer = null; }

  // ---------- 전체 화면 ----------
  function toggleFs() {
    const on = !document.body.classList.contains('fs');
    document.body.classList.toggle('fs', on);
    $('btn-fs').textContent = on ? '⛶ 전체 화면 끝내기' : '⛶ 전체 화면';
    try {
      if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (e) {}
  }
  $('btn-fs').addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('fs')) toggleFs();
  });

  // ---------- 키보드 ----------
  // 버튼에 포커스가 있을 때 Space가 버튼 클릭으로도 처리되어 두 번 눌리는 것을 막는다
  document.addEventListener('keyup', e => { if (e.key === ' ' && e.target.tagName === 'BUTTON') e.preventDefault(); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); mode === 'sw' ? swToggle() : tmToggle(); }
    else if (k === 'l' || k === 'ㅣ') { if (mode === 'sw') swLap(); }
    else if (k === 'r' || k === 'ㄱ') { mode === 'sw' ? swReset() : tmReset(); }
    else if (k === 'f' || k === 'ㄹ') toggleFs();
  });

  swUpdateButtons();
  tmSet(300);
</script>
</body>
</html>
